name: Stock Monitor

on:
  schedule:
    # 14:30 CST = 06:30 UTC, 周一至周五
    - cron: '30 6 * * 1-5'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk 2>/dev/null
          pip install requests numpy matplotlib

      - name: Decode config
        run: echo "$CONFIG" | base64 -d > config.json
        env:
          CONFIG: ${{ secrets.CONFIG_JSON }}

      - name: Run monitor
        run: PYTHONIOENCODING=utf-8 python monitor.py

      - name: Generate site
        run: PYTHONIOENCODING=utf-8 python site_generator.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
